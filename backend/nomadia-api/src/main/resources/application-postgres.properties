# ============================================================
# Perfil postgres: base de datos real del proyecto (PostgreSQL 16 + PostGIS).
# Requisito: haber ejecutado los scripts database/01 a 03 del repositorio nomadia-platform.
# Las credenciales se leen de variables de entorno (nunca se suben a Git).
# currentSchema: el disparador trg_verifica_presupuesto usa nombres sin esquema,
# por eso la conexión debe buscar primero en nomadia_core (y en public para PostGIS).
# ============================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nomadia}?currentSchema=nomadia_core,public
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.sql.init.mode=never
