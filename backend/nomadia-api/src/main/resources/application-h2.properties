# ============================================================
# Perfil h2: base de datos en memoria con la misma estructura de nomadia_core.
# Se reinicia en cada arranque. Consola: http://localhost:8080/h2-console
#   JDBC URL: jdbc:h2:mem:nomadia   Usuario: sa   Contraseña: (vacía)
# ============================================================
spring.datasource.url=jdbc:h2:mem:nomadia;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/h2/schema.sql
spring.sql.init.data-locations=classpath:db/h2/data.sql
spring.sql.init.encoding=UTF-8
spring.h2.console.enabled=true
