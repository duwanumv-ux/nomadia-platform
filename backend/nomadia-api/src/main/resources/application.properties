# ============================================================
# NomadIA - Configuración general
# Perfil por defecto: h2 (demostración sin instalar nada).
# Para usar la base PostgreSQL del proyecto: --spring.profiles.active=postgres
# ============================================================
spring.application.name=nomadia-api
spring.profiles.active=h2
server.port=8080

# JPA: el esquema lo crean los scripts SQL del proyecto, Hibernate no lo modifica
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=nomadia_core
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.cache=false

# Los errores de la API se responden en formato Problem Details (RFC 9457)
# desde ApiExceptionHandler, con mensajes en español.

# Zona horaria de Colombia para fechas y registros
spring.jackson.time-zone=America/Bogota
